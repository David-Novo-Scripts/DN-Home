house:
  resident_name: David

voice:
  engine: edge
  language: pt-PT
  default_voice: pt-PT-DuarteNeural
  # Edge TTS prosody uses a mandatory sign: percentage for rate, Hz for pitch.
  rate: "+0%"
  pitch: "+0Hz"
  # Audio gain applied by Edge TTS; separate from the Nest's physical volume.
  tts_volume: "+0%"

speaker:
  provider: cast
  name: ""
  host: ""
  port: 8009
  # false preserves the Nest's current physical volume unless --volume is explicit.
  manage_volume: false
  # Used automatically only when manage_volume is true.
  volume: 35
  restore_previous_volume: true
  connect_timeout: 10
  playback_timeout: 60

network:
  # Leave empty to select the source address/interface from the route to speaker.host.
  lan_interface: ""
  lan_ip: ""

http:
  # Dedicated Cast media port. The matching firewall rule must be equally narrow.
  port: 8765
  request_timeout: 20

logging:
  level: INFO
  file: logs/dn_home.log
  max_bytes: 2097152
  backup_count: 3
